name: Actualizar pronóstico INUMET

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses:       - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: python-version: "3.x"

      - run: pip install requests beautifulsoup4

      - run: python fetch_inumet.py

      - name: Guardar datos actualizados
        run: |
          git config user.name "Tiempo Montevideo"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Actualizar pronóstico INUMET"
          git pull --rebase origin main
          git push
