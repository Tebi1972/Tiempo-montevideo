name: Actualizar pronóstico INUMET

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar con GitHub
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Obtener pronóstico INUMET
        run: python fetch_inumet.py

      - name: Guardar pronóstico
        run: |
          git config user.name "Tiempo Montevideo"
          git config user.email "tiempo@montevideo.local"
          git add data.json
          git diff --cached --quiet || git commit -m "Actualizar pronóstico INUMET"
          git push origin main
