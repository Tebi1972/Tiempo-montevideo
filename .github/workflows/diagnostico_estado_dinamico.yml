name: Diagnóstico estado dinámico INUMET

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: pip install requests

      - name: Ejecutar diagnóstico
        run: python diagnostico_estado_dinamico.py
