name: Diagnosticar hora dinámica INUMET

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: pip install requests

      - name: Ejecutar diagnóstico
        run: python diagnostico_hora_dinamica.py

      - name: Mostrar resultado JSON
        if: always()
        run: |
          if [ -f diagnostico_hora_dinamica.json ]; then
            cat diagnostico_hora_dinamica.json
          fi
