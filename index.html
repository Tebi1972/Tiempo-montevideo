<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tiempo Montevideo — INUMET</title>

<style>

* { box-sizing:border-box; }

:root {
  --bg1:#92d4ff;
  --bg2:#fff0a0;
  --glow:rgba(255,245,180,.75);
  --text:#172033;
  --muted:#52647a;

  --glass:rgba(220,240,250,.18);
  --glass-small:rgba(230,244,250,.16);
  --border:rgba(255,255,255,.30);

  --cloud-speed-1:38s;
  --cloud-speed-2:48s;
  --cloud-speed-3:58s;
}


/* ==========================================
   PÁGINA
   ========================================== */

body {
  margin:0;
  min-height:100vh;

  color:var(--text);

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 92% 7%,
      var(--glow),
      transparent 28%
    ),
    linear-gradient(
      145deg,
      var(--bg1),
      var(--bg2)
    );

  background-attachment:fixed;

  transition:
    background 1.5s ease,
    color 1s ease;

  overflow-x:hidden;
}


/* ==========================================
   DÍA — SOLEADO
   ========================================== */

body.sunny {
  --bg1:#ffd447;
  --bg2:#fff5ad;

  --glow:rgba(255,255,220,.95);

  --glass:rgba(255,238,130,.18);
  --glass-small:rgba(255,244,175,.17);
}


/* ==========================================
   DÍA — SOL Y NUBES
   ========================================== */

body.partly {
  --bg1:#91d6f2;
  --bg2:#fff0a2;

  --glow:rgba(255,250,185,.90);

  --glass:rgba(215,239,235,.18);
  --glass-small:rgba(225,241,239,.16);
}


/* ==========================================
   NUBLADO
   ========================================== */

body.cloudy {
  --bg1:#96a8b8;
  --bg2:#dce5eb;

  --glow:rgba(255,255,255,.30);

  --glass:rgba(210,222,230,.20);
  --glass-small:rgba(220,230,236,.17);
}


/* ==========================================
   LLUVIA
   ========================================== */

body.rainy {
  --bg1:#617b93;
  --bg2:#b9cad6;

  --glow:rgba(220,240,250,.20);

  --glass:rgba(190,210,224,.20);
  --glass-small:rgba(205,220,230,.17);
}


/* ==========================================
   TORMENTA
   ========================================== */

body.stormy {
  --bg1:#3e4b5d;
  --bg2:#8495a6;

  --glow:rgba(210,225,240,.14);

  --glass:rgba(180,195,210,.20);
  --glass-small:rgba(195,208,220,.16);
}


/* ==========================================
   NOCHE
   ========================================== */

body.night {
  --bg1:#07182f;
  --bg2:#183c62;

  --glow:rgba(195,218,255,.17);

  --text:#f4f8ff;
  --muted:#c5d3e4;

  --glass:rgba(75,105,140,.20);
  --glass-small:rgba(90,120,150,.17);

  --border:rgba(220,235,255,.16);
}


/* NOCHE NUBLADA */

body.night.cloudy,
body.night.partly {
  --bg1:#102238;
  --bg2:#38536c;

  --glow:rgba(210,225,245,.12);
}


/* NOCHE LLUVIOSA */

body.night.rainy {
  --bg1:#071523;
  --bg2:#29465e;
}


/* NOCHE CON TORMENTA */

body.night.stormy {
  --bg1:#050b14;
  --bg2:#25384b;
}


/* ==========================================
   ATMÓSFERA
   ========================================== */

.atmosphere {
  position:fixed;
  inset:0;

  pointer-events:none;
  overflow:hidden;

  z-index:0;
}


/* ==========================================
   SOL
   ========================================== */

.sunGlow {
  position:absolute;

  width:430px;
  height:430px;

  border-radius:50%;

  right:-120px;
  top:-150px;

  background:
    radial-gradient(
      circle,
      rgba(255,255,225,.98) 0%,
      rgba(255,224,80,.50) 32%,
      transparent 70%
    );

  opacity:0;

  transition:opacity 1.5s ease;
}

body.sunny:not(.night) .sunGlow,
body.partly:not(.night) .sunGlow {
  opacity:1;
}


/* ==========================================
   LUNA
   ========================================== */

.moonGlow {
  position:absolute;

  width:280px;
  height:280px;

  right:-45px;
  top:-65px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(245,249,255,.75) 0%,
      rgba(190,215,255,.18) 35%,
      transparent 70%
    );

  opacity:0;

  transition:opacity 1.5s ease;
}

body.night .moonGlow {
  opacity:1;
}


/* ==========================================
   ESTRELLAS
   ========================================== */

.stars {
  position:absolute;

  inset:0;

  opacity:0;

  background-image:

    radial-gradient(
      circle at 15% 12%,
      rgba(255,255,255,.8) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle at 30% 20%,
      rgba(255,255,255,.6) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle at 52% 8%,
      rgba(255,255,255,.8) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle at 70% 24%,
      rgba(255,255,255,.7) 0 1px,
      transparent 2px
    ),

    radial-gradient(
      circle at 87% 15%,
      rgba(255,255,255,.8) 0 1px,
      transparent 2px
    );

  background-size:230px 180px;

  transition:opacity 1.5s ease;
}

body.night .stars {
  opacity:.65;
}


/* ==========================================
   NUBES
   ========================================== */

.cloud {
  position:absolute;

  width:220px;
  height:55px;

  left:-300px;

  border-radius:100px;

  background:rgba(255,255,255,.18);

  filter:blur(2px);

  opacity:0;
}

.cloud::before,
.cloud::after {
  content:"";

  position:absolute;

  background:inherit;

  border-radius:50%;
}

.cloud::before {
  width:90px;
  height:90px;

  left:35px;
  top:-38px;
}

.cloud::after {
  width:120px;
  height:120px;

  right:25px;
  top:-55px;
}


/* VISIBILIDAD SEGÚN EL TIEMPO */

body.partly .cloud {
  opacity:.28;
}

body.cloudy .cloud {
  opacity:.38;
}

body.rainy .cloud,
body.stormy .cloud {
  opacity:.42;
}

body.night .cloud {
  background:rgba(205,220,240,.11);
}


/* NUBES INDIVIDUALES */

.cloud1 {
  top:18%;

  animation:
    windCloud
    var(--cloud-speed-1)
    linear
    infinite;
}

.cloud2 {
  top:46%;

  transform:scale(.72);

  animation:
    windCloud
    var(--cloud-speed-2)
    linear
    infinite;

  animation-delay:-16s;
}

.cloud3 {
  top:72%;

  transform:scale(.52);

  animation:
    windCloud
    var(--cloud-speed-3)
    linear
    infinite;

  animation-delay:-30s;
}

@keyframes windCloud {

  from {
    left:-330px;
  }

  to {
    left:110vw;
  }
}


/* ==========================================
   LLUVIA
   ========================================== */

.rain {
  position:absolute;

  inset:0;

  opacity:0;

  background-image:

    repeating-linear-gradient(
      105deg,

      transparent 0px,
      transparent 18px,

      rgba(255,255,255,.18) 19px,
      rgba(255,255,255,.18) 21px,

      transparent 22px,
      transparent 40px
    );

  background-size:80px 80px;
}

body.rainy .rain,
body.stormy .rain {
  opacity:.38;

  animation:
    rainMove .55s linear infinite;
}

@keyframes rainMove {

  from {
    background-position:0 -80px;
  }

  to {
    background-position:-25px 80px;
  }
}


/* ==========================================
   RELÁMPAGOS
   ========================================== */

.flash {
  position:absolute;

  inset:0;

  background:white;

  opacity:0;
}

body.stormy .flash {
  animation:
    lightning 9s infinite;
}

@keyframes lightning {

  0%,91%,94%,100% {
    opacity:0;
  }

  92% {
    opacity:.15;
  }

  93% {
    opacity:0;
  }

  93.5% {
    opacity:.08;
  }
}


/* ==========================================
   CONTENIDO
   ========================================== */

.wrap {
  position:relative;

  z-index:2;

  max-width:760px;

  margin:auto;

  padding:18px;
}

.source {
  font-size:13px;

  font-weight:800;

  color:var(--muted);
}

h1 {
  font-size:32px;

  margin:6px 0;
}

h2 {
  margin-top:0;
}

.muted {
  color:var(--muted);
}


/* ==========================================
   TARJETAS
   ========================================== */

.card {
  background:var(--glass);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  border:1px solid var(--border);

  border-radius:22px;

  padding:20px;

  margin:14px 0;

  box-shadow:
    0 8px 28px rgba(23,32,51,.07),
    inset 0 1px 0 rgba(255,255,255,.16);
}

.tempBox,
.item,
.recommendation {
  background:var(--glass-small);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);

  border:1px solid var(--border);
}


/* ==========================================
   CABECERA
   ========================================== */

.weatherTop {
  display:flex;

  align-items:center;

  gap:16px;

  margin-bottom:20px;
}

.weatherIcon {
  font-size:58px;

  line-height:1;

  filter:
    drop-shadow(
      0 4px 7px rgba(0,0,0,.10)
    );
}

.weatherInfo {
  flex:1;
}

.currentLine {
  display:flex;

  align-items:baseline;

  flex-wrap:wrap;

  gap:7px;
}

.currentTemp {
  font-size:42px;

  font-weight:850;

  line-height:1;
}

.separator {
  font-size:25px;

  opacity:.55;
}

.weatherTitle {
  font-size:20px;

  font-weight:800;
}

.currentSource {
  color:var(--muted);

  font-size:13px;

  margin-top:7px;

  font-weight:600;
}

.weatherDate {
  color:var(--muted);

  margin-top:4px;
}


/* ==========================================
   MÍNIMA / MÁXIMA
   ========================================== */

.temps {
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

  margin-bottom:18px;
}

.tempBox {
  border-radius:18px;

  padding:18px;

  text-align:center;
}

.tempLabel {
  font-size:12px;

  font-weight:800;

  color:var(--muted);

  text-transform:uppercase;
}

.temp {
  font-size:46px;

  font-weight:850;

  margin-top:5px;
}


/* ==========================================
   DETALLES
   ========================================== */

.grid {
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;
}

.item {
  border-radius:15px;

  padding:14px;
}

.label {
  font-size:12px;

  color:var(--muted);

  font-weight:800;

  text-transform:uppercase;
}

.value {
  margin-top:6px;

  line-height:1.45;

  font-weight:600;
}


/* ==========================================
   RECOMENDACIONES
   ========================================== */

.recommendations {
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;
}

.recommendation {
  border-radius:18px;

  padding:17px;

  text-align:center;
}

.recIcon {
  font-size:34px;
}

.recQuestion {
  font-size:12px;

  color:var(--muted);

  font-weight:800;

  margin-top:5px;

  text-transform:uppercase;
}

.recAnswer {
  font-size:18px;

  font-weight:800;

  margin-top:7px;
}


/* ==========================================
   PRÓXIMOS DÍAS
   ========================================== */

.nextDay {
  padding:15px 0;

  border-bottom:
    1px solid var(--border);
}

.nextDay:last-child {
  border-bottom:0;
}

.nextHeader {
  display:flex;

  justify-content:space-between;

  align-items:center;
}

.nextName {
  font-size:17px;

  font-weight:800;
}

.nextTemp {
  font-size:18px;

  font-weight:800;
}

.nextText {
  margin-top:8px;

  color:var(--muted);

  line-height:1.45;
}


/* ==========================================
   BOTÓN
   ========================================== */

button {
  border:1px solid var(--border);

  border-radius:14px;

  padding:13px 19px;

  background:rgba(23,32,51,.88);

  color:white;

  font-size:15px;

  font-weight:750;

  cursor:pointer;

  box-shadow:
    0 5px 14px rgba(23,32,51,.15);
}

.footer {
  font-size:12px;
}

a {
  color:inherit;
}


/* ==========================================
   ACCESIBILIDAD
   ========================================== */

@media (prefers-reduced-motion:reduce) {

  *,
  *::before,
  *::after {
    animation:none !important;

    transition:none !important;
  }
}


/* ==========================================
   CELULAR
   ========================================== */

@media (max-width:520px) {

  .wrap {
    padding:14px;
  }

  h1 {
    font-size:28px;
  }

  .currentTemp {
    font-size:36px;
  }

  .weatherTitle {
    font-size:18px;
  }

  .temp {
    font-size:41px;
  }

  .grid {
    grid-template-columns:1fr;
  }

  .weatherIcon {
    font-size:52px;
  }
}

</style>
</head>

<div class="wrap">

<script>


/* ==========================================
   SEGURIDAD
   ========================================== */

function esc(value) {

  return String(value ?? "")
    .replace(/[&<>"]/g, function(c) {

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[c];

    });
}


/* ==========================================
   TEXTO METEOROLÓGICO
   ========================================== */

function forecastText(day) {

  return (
    (day.morning || "") +
    " " +
    (day.evening || "") +
    " " +
    (day.rain || "")
  ).toLowerCase();
}


/* ==========================================
   ICONO
   ========================================== */

function icon(day) {

  const text =
    forecastText(day);


  if (text.includes("torment"))
    return "⛈️";


  if (
    text.includes("precipit") ||
    text.includes("lluvia") ||
    text.includes("chaparr")
  )
    return "🌧️";


  if (text.includes("cubierto"))
    return "☁️";


  if (text.includes("nuboso"))
    return "🌤️";


  return "☀️";
}


/* ==========================================
   DESCRIPCIÓN
   ========================================== */

function shortDescription(day) {

  const text =
    forecastText(day);


  if (text.includes("torment"))
    return "Posibles tormentas";


  if (
    text.includes("precipit") ||
    text.includes("lluvia") ||
    text.includes("chaparr")
  )
    return "Posibles precipitaciones";


  if (text.includes("cubierto"))
    return "Cielo cubierto";


  if (text.includes("nuboso"))
    return "Nubosidad variable";


  return "Cielo mayormente despejado";
}


/* ==========================================
   TEMPERATURA ACTUAL
   ========================================== */

function getCurrentTemp(data) {

  if (
    !data.current ||
    data.current.temperature === null ||
    data.current.temperature === undefined
  )
    return null;


  const temp =
    Number(data.current.temperature);


  return Number.isFinite(temp)
    ? temp
    : null;
}


function formatTemperature(temp) {

  return temp.toLocaleString(
    "es-UY",
    {
      minimumFractionDigits:1,
      maximumFractionDigits:1
    }
  );
}


/* ==========================================
   HORA ACTUAL EN URUGUAY
   ========================================== */

function uruguayHour() {

  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone:"America/Montevideo",
        hour:"2-digit",
        hour12:false
      }
    ).formatToParts(new Date());


  const hour =
    parts.find(
      part => part.type === "hour"
    );


  return Number(hour.value);
}


/* ==========================================
   DÍA / NOCHE
   ========================================== */

function isNightInUruguay() {

  const hour =
    uruguayHour();


  return (
    hour >= 20 ||
    hour < 7
  );
}


/* ==========================================
   VIENTO
   ========================================== */

function getMaximumWind(day) {

  const wind =
    String(
      day.wind || ""
    ).toLowerCase();


  const numbers =
    wind.match(/\d+/g);


  if (!numbers)
    return 0;


  return Math.max(
    ...numbers.map(Number)
  );
}


/* ==========================================
   AMBIENTE VISUAL
   ========================================== */

function applyWeatherTheme(
  day,
  currentTemp
) {

  const body =
    document.body;


  body.className = "";


  const text =
    forecastText(day);


  /* CONDICIÓN PRINCIPAL */

  if (text.includes("torment")) {

    body.classList.add(
      "stormy"
    );

  }

  else if (
    text.includes("precipit") ||
    text.includes("lluvia") ||
    text.includes("chaparr")
  ) {

    body.classList.add(
      "rainy"
    );

  }

  else if (
    text.includes("cubierto")
  ) {

    body.classList.add(
      "cloudy"
    );

  }

  else if (
    text.includes("nuboso")
  ) {

    body.classList.add(
      "partly"
    );

  }

  else {

    body.classList.add(
      "sunny"
    );

  }


  /* DÍA / NOCHE */

  if (
    isNightInUruguay()
  ) {

    body.classList.add(
      "night"
    );

  }


  /* ======================================
     VELOCIDAD DE LAS NUBES
     ====================================== */

  const maxWind =
    getMaximumWind(day);


  let speed1 = 38;
  let speed2 = 48;
  let speed3 = 58;


  if (maxWind >= 60) {

    speed1 = 10;
    speed2 = 14;
    speed3 = 18;

  }

  else if (maxWind >= 40) {

    speed1 = 15;
    speed2 = 20;
    speed3 = 26;

  }

  else if (maxWind >= 25) {

    speed1 = 23;
    speed2 = 30;
    speed3 = 37;

  }


  document.documentElement.style
    .setProperty(
      "--cloud-speed-1",
      speed1 + "s"
    );


  document.documentElement.style
    .setProperty(
      "--cloud-speed-2",
      speed2 + "s"
    );


  document.documentElement.style
    .setProperty(
      "--cloud-speed-3",
      speed3 + "s"
    );
}


/* ==========================================
   PARAGUAS
   ========================================== */

function umbrellaAdvice(day) {

  const text =
    forecastText(day);


  if (
    text.includes("baja probabilidad") &&
    (
      text.includes("precipit") ||
      text.includes("lluvia")
    )
  )
    return "Por las dudas";


  if (
    text.includes("torment") ||
    text.includes("precipit") ||
    text.includes("lluvia") ||
    text.includes("chaparr")
  )
    return "Sí, mejor llevar";


  return "No parece necesario";
}


/* ==========================================
   ABRIGO
   ========================================== */

function coatAdvice(day) {

  const min =
    Number(day.min);

  const max =
    Number(day.max);


  if (
    min <= 7 ||
    max <= 13
  )
    return "Sí, abrigo";


  if (
    min <= 11 ||
    max <= 17
  )
    return "Abrigo liviano";


  return "No parece necesario";
}


/* ==========================================
   CARGAR DATA.JSON
   ========================================== */

async function load() {

  try {


    const response =
      await fetch(
        "data.json?v=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if (!response.ok)
      throw new Error(
        "No se pudo leer data.json"
      );


    const data =
      await response.json();


    if (
      !data.days ||
      data.days.length === 0
    )
      throw new Error(
        "No hay pronóstico disponible"
      );


    const today =
      data.days[0];


    const currentTemp =
      getCurrentTemp(data);


    /* ======================================
       APLICAR AMBIENTE
       ====================================== */

    applyWeatherTheme(
      today,
      currentTemp
    );


    /* ======================================
       ÚLTIMA ACTUALIZACIÓN
       ====================================== */

    document.getElementById(
      "updated"
    ).textContent =

      "Última actualización: " +
      data.updated;


    /* ======================================
       CABECERA
       ====================================== */

    let currentHeader;


    if (
      currentTemp !== null
    ) {


      currentHeader = `

        <div class="currentLine">

          <span class="currentTemp">
            ${formatTemperature(
              currentTemp
            )}°
          </span>


          <span class="separator">
            ·
          </span>


          <span class="weatherTitle">

            ${esc(
              shortDescription(today)
            )}

          </span>

        </div>


        <div class="currentSource">

          Temperatura actual · INUMET
          ${esc(
            data.current.station ||
            "Prado"
          )}

        </div>


        <div class="weatherDate">

          ${esc(today.date)}

        </div>
      `;

    }

    else {


      currentHeader = `

        <div class="weatherTitle">

          ${esc(
            shortDescription(today)
          )}

        </div>


        <div class="currentSource">

          Temperatura actual no disponible

        </div>


        <div class="weatherDate">

          ${esc(today.date)}

        </div>
      `;
    }


    /* ======================================
       TARJETA DE HOY
       ====================================== */

    document.getElementById(
      "today"
    ).innerHTML = `

      <div class="weatherTop">


        <div class="weatherIcon">

          ${icon(today)}

        </div>


        <div class="weatherInfo">

          ${currentHeader}

        </div>


      </div>


      <div class="temps">


        <div class="tempBox">

          <div class="tempLabel">
            Mínima
          </div>

          <div class="temp">
            ${esc(today.min)}°
          </div>

        </div>


        <div class="tempBox">

          <div class="tempLabel">
            Máxima
          </div>

          <div class="temp">
            ${esc(today.max)}°
          </div>

        </div>


      </div>


      <div class="grid">


        <div class="item">

          <div class="label">
            Mañana
          </div>

          <div class="value">
            ${esc(today.morning)}
          </div>

        </div>


        <div class="item">

          <div class="label">
            Tarde / Noche
          </div>

          <div class="value">
            ${esc(today.evening)}
          </div>

        </div>


        <div class="item">

          <div class="label">
            💨 Viento
          </div>

          <div class="value">
            ${esc(today.wind)}
          </div>

        </div>


        <div class="item">

          <div class="label">
            ☔ Precipitaciones
          </div>

          <div class="value">
            ${esc(today.rain)}
          </div>

        </div>


      </div>
    `;


    /* ======================================
       RECOMENDACIONES
       ====================================== */

    document.getElementById(
      "umbrella"
    ).textContent =

      umbrellaAdvice(today);


    document.getElementById(
      "coat"
    ).textContent =

      coatAdvice(today);


    /* ======================================
       RESUMEN
       ====================================== */

    document.getElementById(
      "summary"
    ).textContent =

      data.summary ||
      "Sin resumen disponible.";


    /* ======================================
       PRÓXIMOS DÍAS
       ====================================== */

    document.getElementById(
      "days"
    ).innerHTML =

      data.days
        .slice(1)
        .map(function(day) {

          return `

            <div class="nextDay">


              <div class="nextHeader">


                <div class="nextName">

                  ${icon(day)}
                  ${esc(day.date)}

                </div>


                <div class="nextTemp">

                  ${esc(day.min)}° /
                  ${esc(day.max)}°

                </div>


              </div>


              <div class="nextText">

                ${esc(day.morning)}

                <br>

                ${esc(day.evening)}

              </div>


            </div>
          `;

        })

        .join("");


  }

  catch(error) {


    document.getElementById(
      "updated"
    ).textContent =
      "Error al cargar el pronóstico";


    document.getElementById(
      "today"
    ).innerHTML =
      "<b>No se pudieron cargar los datos de INUMET.</b>";


    document.getElementById(
      "umbrella"
    ).textContent =
      "Sin datos";


    document.getElementById(
      "coat"
    ).textContent =
      "Sin datos";


    console.error(error);
  }
}


/* ==========================================
   INICIAR
   ========================================== */

load();


</script>

</body>
</html>
