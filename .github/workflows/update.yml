name: Actualizar pronóstico INUMET

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Obtener pronóstico INUMET
        run: python fetch_inumet.py

      - name: Guardar cambios
        run: |
          git config user.name "Tiempo Montevideo"
          git config user.email "tiempo@montevideo.local"
          git add data.json
          git commit -m "Actualizar pronóstico INUMET" || echo "Sin cambios"
          git pull --rebase origin main
          git push origin main
