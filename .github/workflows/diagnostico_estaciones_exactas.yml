name: Diagnóstico exacto estaciones INUMET

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Ejecutar diagnóstico exacto
        run: python diagnostico_estaciones_exactas.py
