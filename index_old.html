<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiempo Montevideo — INUMET</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172033;background:#eef3f8}
body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}
header{padding:18px 4px}.brand{font-size:14px;font-weight:700;letter-spacing:.08em;color:#46627d}
h1{margin:6px 0;font-size:32px}.sub{color:#64748b}
.card{background:white;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #17203312}
.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.temp{font-size:46px;font-weight:800}.muted{color:#64748b}
.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#e8f3ff;color:#23557d;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:13px;background:#f5f8fb;border-radius:14px}
.label{font-size:12px;text-transform:uppercase;color:#718096;font-weight:700}.value{margin-top:5px;font-weight:650}
h2{font-size:19px;margin:0 0 9px}.summary{font-size:18px;line-height:1.5}
.day{border-top:1px solid #e5eaf0;padding:15px 0}.day:first-child{border-top:0}
button{border:0;border-radius:12px;padding:11px 15px;background:#193b59;color:white;font-weight:700}
a{color:#1e5b8d}
footer{font-size:12px;color:#718096;padding:10px 4px 30px}
@media(max-width:520px){.hero{align-items:flex-start}.grid{grid-template-columns:1fr}.temp{font-size:40px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand">INUMET · ÁREA METROPOLITANA</div>
<h1>Tiempo en Montevideo</h1>
<div class="sub" id="updated">Cargando pronóstico oficial…</div>
</header>

<section class="card" id="today"></section>
<section class="card">
<h2>En pocas palabras</h2>
<div class="summary" id="summary">Consultando INUMET…</div>
</section>
<section class="card">
<h2>Próximos días</h2>
<div id="days"></div>
</section>
<button onclick="load()">↻ Actualizar</button>
<footer>
Fuente oficial: <a href="https://www.inumet.gub.uy/tiempo/pronostico" target="_blank">INUMET — Pronóstico</a>.<br>
Esta primera versión usa un pequeño servidor local para consultar y procesar la página oficial.
</footer>
</div>
<script>
async function load(){
  document.getElementById('updated').textContent='Consultando pronóstico oficial…';
  try{
    const r=await fetch('/api/pronostico'); const d=await r.json();
    if(d.error) throw Error(d.error);
    document.getElementById('updated').textContent='Última actualización de INUMET: '+d.updated;
    const t=d.days[0];
    document.getElementById('today').innerHTML=`
      <div class="hero"><div><span class="badge">${t.date}</span>
      <div class="temp">${t.min}° / ${t.max}°</div><div class="muted">${t.morning}</div></div>
      <div style="font-size:48px">☁️</div></div>
      <div class="grid" style="margin-top:16px">
      <div class="item"><div class="label">Mañana</div><div class="value">${t.morning}</div></div>
      <div class="item"><div class="label">Tarde / noche</div><div class="value">${t.evening}</div></div>
      <div class="item"><div class="label">Viento</div><div class="value">${t.wind}</div></div>
      <div class="item"><div class="label">Lluvia</div><div class="value">${t.rain}</div></div>
      </div>`;
    document.getElementById('summary').textContent=d.summary;
    document.getElementById('days').innerHTML=d.days.slice(1).map(x=>`
      <div class="day"><b>${x.date}</b> · ${x.min}° / ${x.max}°<br>
      <span class="muted">${x.morning}</span><br><span class="muted">${x.evening}</span></div>`).join('');
  }catch(e){
    document.getElementById('updated').textContent='No se pudo consultar INUMET';
    document.getElementById('summary').innerHTML='<b>Atención:</b> '+e.message+'<br><br>Verificá que el servidor esté iniciado y que haya conexión a Internet.';
  }
}
load();
</script>
</body>
</html>
