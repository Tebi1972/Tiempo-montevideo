name: Diagnóstico estaciones INUMET

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar requests
        run: pip install requests

      - name: Ejecutar diagnóstico nacional
        run: python diagnostico_estaciones.py

      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostico_estaciones.json
          git diff --cached --quiet || git commit -m "Actualizar diagnóstico estaciones INUMET"
          git pull --rebase origin main
          git push
