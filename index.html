<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiempo Montevideo — INUMET</title><style>body{margin:0;background:#eef3f8;color:#172033;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #17203312}h1{font-size:32px}.temp{font-size:46px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:13px;background:#f5f8fb;border-radius:14px}.label{font-size:12px;color:#718096;font-weight:700}.value{margin-top:5px;font-weight:650}.muted{color:#64748b}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><b>INUMET · ÁREA METROPOLITANA</b></p><h1>Tiempo en Montevideo</h1><div class="muted" id="updated">Cargando…</div><section class="card" id="today">Consultando pronóstico…</section><section class="card"><h2>En pocas palabras</h2><div id="summary">—</div></section><section class="card"><h2>Próximos días</h2><div id="days">—</div></section><button onclick="load()">↻ Actualizar</button><p class="muted" style="font-size:12px">Fuente: <a href="https://www.inumet.gub.uy/tiempo/pronostico">INUMET</a></p></div><script>const e=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){try{let r=await fetch('data.json?'+Date.now());if(!r.ok)throw Error('Todavía no hay datos.');let d=await r.json(),t=d.days[0];document.querySelector('#updated').textContent='Última actualización: '+d.updated;document.querySelector('#today').innerHTML='<div class="temp">'+e(t.min)+'° / '+e(t.max)+'°</div><p>'+e(t.morning)+'</p><div class="grid"><div class="item"><div class="label">MAÑANA</div><div class="value">'+e(t.morning)+'</div></div><div class="item"><div class="label">TARDE / NOCHE</div><div class="value">'+e(t.evening)+'</div></div><div class="item"><div class="label">VIENTO</div><div class="value">'+e(t.wind)+'</div></div><div class="item"><div class="label">LLUVIA</div><div class="value">'+e(t.rain)+'</div></div></div>';document.querySelector('#summary').textContent=d.summary;document.querySelector('#days').innerHTML=d.days.slice(1).map(x=>'<p><b>'+e(x.date)+'</b> · '+e(x.min)+'° / '+e(x.max)+'°<br>'+e(x.morning)+'<br>'+e(x.evening)+'</p>').join('')}catch(x){document.querySelector('#updated').textContent='Esperando actualización automática';document.querySelector('#today').innerHTML='<b>La conexión con INUMET todavía se está preparando.</b><p>'+e(x.message)+'</p>'}}load()</script></body></html>
