name: Actualizar advertencias INUMET

on:
  schedule:
    # Cada 30 minutos, separado del minuto 00 para reducir choques
    # con el workflow general de pronóstico/observaciones.
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos-inumet
  cancel-in-progress: false

jobs:
  actualizar-alertas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Sincronizar antes de consultar
        run: git pull --rebase origin main

      - name: Actualizar solo advertencias
        run: python fetch_alertas.py

      - name: Guardar data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Actualizar advertencias INUMET"
          git pull --rebase origin main
          git push
